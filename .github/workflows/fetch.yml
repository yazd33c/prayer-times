name: Fetch Elevation Data

on:
  schedule:
    # هر ساعت یک بار اجرا می‌شود
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script
        run: python fetch_data.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add elevation_data_002.json progress_002.json
          git diff --staged --quiet || git commit -m "Update elevation data 0.02"
          git push
